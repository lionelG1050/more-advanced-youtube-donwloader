name: دانلودر یوتیوب (480p)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو یوتیوب'
        required: true
        type: string

      output_format:
        description: 'نوع خروجی'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      max_part_mb:
        description: 'حداکثر حجم هر قسمت (MB) - 0 = خودکار'
        required: false
        type: string
        default: '90'

      upload_method:
        description: '📤 روش ذخیره نهایی'
        required: true
        type: choice
        options:
          - repository (push to repo)
          - release (GitHub Releases)
        default: 'repository (push to repo)'

      release_tag:
        description: '🏷️ نام تگ ریلیز'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  youtube-download:
    runs-on: ubuntu-latest

    # ✅ GHCR Docker Image
    container:
      image: ghcr.io/lionelg1050/youtube-downloader:latest

    timeout-minutes: 45

    steps:
      # ✅ FIXES "fatal: not in a git directory"
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Download video/audio
      - name: 📥 Download YouTube Media
        id: download
        shell: bash
        run: |
          URL="${{ github.event.inputs.video_url }}"
          FORMAT_INPUT="${{ github.event.inputs.output_format }}"

          mkdir -p release_files

          if [ "$FORMAT_INPUT" = "mp3 (audio only)" ]; then
            FORMAT="mp3"
            QUALITY="192"
          else
            FORMAT="mp4"
            QUALITY="480"
          fi

          echo "Downloading..."
          echo "URL: $URL"
          echo "FORMAT: $FORMAT"

          python3 main.py "$URL" "$QUALITY"

          FILE=$(find . -maxdepth 1 \( -name "*.mp4" -o -name "*.mp3" \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "::error::Download failed"
            exit 1
          fi

          BASENAME=$(basename "$FILE")

          mv "$FILE" "release_files/$BASENAME"

          echo "filename=$BASENAME" >> $GITHUB_OUTPUT
          echo "actual_quality=${QUALITY}" >> $GITHUB_OUTPUT

      # ✅ FIXES "[[: not found"
      - name: ✂️ Split Large File (if needed)
        shell: bash
        run: |
          FILENAME="${{ steps.download.outputs.filename }}"
          THRESH_MB="${{ github.event.inputs.max_part_mb }}"

          if [ -z "$THRESH_MB" ] || [ "$THRESH_MB" -le 0 ] || [ "$THRESH_MB" -gt 1900 ]; then
            THRESH_MB=90
          fi

          FILESIZE=$(stat -c%s "release_files/$FILENAME")
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))

          echo "File size: $FILESIZE bytes"

          if [ "$FILESIZE" -gt "$THRESH_BYTES" ]; then
            echo "Splitting zip..."

            BASE="${FILENAME%.*}"

            cd release_files

            zip -r -s "${THRESH_MB}m" "${BASE}.zip" "$FILENAME"

            rm "$FILENAME"

            cd ..
          else
            echo "No split needed"
          fi

      # ✅ Clean previous files
      - name: 🧹 Remove previous downloads
        if: github.event.inputs.upload_method == 'repository (push to repo)'
        shell: bash
        run: |
          mkdir -p downloads
          rm -rf downloads/*

      # ✅ Push to repository
      - name: 📤 Push to Repository
        if: github.event.inputs.upload_method == 'repository (push to repo)'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p downloads

          mv release_files/* downloads/

          git add downloads/

          git commit -m "⬇️ YouTube Download [skip ci]" || echo "Nothing to commit"

          git push

      # ✅ Upload to Releases
      - name: 📤 Upload to GitHub Releases
        if: github.event.inputs.upload_method == 'release (GitHub Releases)'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('yt-{0}', github.run_number) }}

          name: YouTube Download

          body: |
            📽️ YouTube Download

            Original Link:
            ${{ github.event.inputs.video_url }}

            Quality:
            ${{ steps.download.outputs.actual_quality }}

            Format:
            ${{ github.event.inputs.output_format }}

          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Cleanup
      - name: 🧹 Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf release_files || true
